[project]
name = "crypto-trading-platform"
version = "0.1.0"
description = "Plataforma personal de análisis y paper trading de criptomonedas (spot). Ver plan-plataforma-trading-cripto(editado).md para la especificación completa."
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.1,<4.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    # ccxt: cliente de Binance para la capa `data` (secciones 9 y 15.10 del
    # plan lo nombran explícitamente como el cliente previsto: "Cliente de
    # Binance/ccxt"). Se prefiere sobre llamadas REST manuales porque ya
    # resuelve firmado de peticiones autenticadas (necesario en fases
    # posteriores), límites de tasa y parseo de OHLCV de forma madura y
    # probada, evitando reimplementar esa lógica a mano.
    "ccxt>=4.5,<5.0",
    # anthropic: SDK oficial para los agentes de interpretación (sección 5
    # del plan: "IA: SDK oficial de Anthropic — soporte nativo de prompt
    # caching y salida estructurada"). Ya decidido en el plan, no hay
    # alternativa a evaluar: es el cliente oficial del proveedor elegido, con
    # mantenimiento activo de Anthropic y sin dependencias pesadas propias.
    "anthropic>=0.40,<1.0",
    # streamlit: interfaz local del Paso 10 (secciones 5, 8.8 y 8.9 del plan:
    # "Interfaz: Streamlit — interfaz funcional en días, sin frontend
    # separado"). Ya decidido en el plan. Problema que resuelve: mostrar los
    # resultados sin construir un frontend aparte. Alternativa sin
    # dependencia: ninguna razonable (habría que escribir HTML/JS a mano o
    # un servidor web propio, que sí ampliaría la superficie de ataque).
    # Mantenimiento: proyecto muy activo, versiones fijadas con tope <2.0.
    # Seguridad: arrastra muchas dependencias (pyarrow, pydeck, altair...);
    # por eso solo corre dentro del contenedor, publicado únicamente en
    # 127.0.0.1 (ver docker-compose.yml) y sin ninguna credencial de
    # exchange. Impacto arquitectónico: solo `app/ui/` lo importa (test de
    # arquitectura); el resto del código no depende de él.
    "streamlit>=1.50,<2.0",
    # apscheduler: scheduler de tareas periódicas para el proceso operativo
    # (Paso 11b del plan: ingesta horaria, ciclo diario a las 00:05 UTC,
    # monitor cada 60 s, heartbeat cada 5 min, copia de datos). Problema que
    # resuelve: correr múltiples jobs con distintas periodicidades en un
    # único proceso Python con `max_instances=1` y `coalesce=True`, sin
    # inventar un scheduler propio (regla de dependencias, sección 31 del
    # master prompt). Alternativa: un bucle manual con `time.sleep` o un
    # crontab del sistema — pero pierden la gestión de concurrencia, el
    # coalescing y la detección de misfire que APScheduler da gratis. Se fija
    # en la rama 3.x (estable, ampliamente usada): la 4.x todavía está en
    # alpha, cambia la API de forma incompatible y no tiene el mismo grado
    # de madurez en producción. Impacto: dependencias ligeras (pytz, six).
    "apscheduler>=3.10,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]
# Experimento Kronos (enmienda E6): NO se instala con el resto. Lo usa solo
# `Dockerfile.kronos`, que instala torch en su variante CPU desde el índice de
# PyTorch y el resto con las versiones que fija el requirements.txt de Kronos.
# Se lista aquí para que la dependencia quede declarada y justificada:
#   torch       -> ejecuta el Transformer de Kronos (no hay alternativa sin dependencia).
#   numpy/pandas-> entradas/salidas del predictor de Kronos.
#   einops, safetensors, huggingface_hub, tqdm -> las exige el código de Kronos.
# Riesgo: código y pesos de terceros; se mitiga fijando el commit del código y la
# revisión + SHA-256 de los pesos, y aislando el contenedor (sin credenciales).
kronos = [
    "torch>=2.0",
    "numpy",
    "pandas",
    "einops",
    "safetensors",
    "huggingface_hub",
    "tqdm",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
