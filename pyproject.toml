[project]
name = "crypto-trading-platform"
version = "0.1.0"
description = "Plataforma personal de análisis y paper trading de criptomonedas (spot). Ver plan-plataforma-trading-cripto(editado).md para la especificación completa."
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.1,<4.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
