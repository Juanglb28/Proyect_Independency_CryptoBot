services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: crypto_trading_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crypto
      POSTGRES_PASSWORD: crypto
      POSTGRES_DB: crypto_trading
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Crea además `crypto_trading_test` (base de pruebas, separada de la
      # real) la primera vez que se inicializa el volumen — ver
      # docker/init-test-db.sql y tests/conftest.py.
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto -d crypto_trading"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # Corre la app dentro de Linux en vez del Python nativo del sistema —
    # ver Dockerfile y README ("Ejecutar comandos dentro de Docker") sobre
    # el bloqueo real de Smart App Control en Windows con las extensiones
    # compiladas de psycopg/pydantic-core/SQLAlchemy.
    build:
      context: .
      dockerfile: Dockerfile
    # Mismo nombre de imagen que `ui`: un solo `docker compose build`
    # actualiza las dos (antes eran imágenes separadas y `pytest` en `app`
    # fallaba con "No module named 'streamlit'" tras agregar la dependencia).
    image: crypto-trading-platform:dev
    container_name: crypto_trading_app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Dentro de la red de docker-compose, el otro contenedor se alcanza
      # por el nombre del servicio ("postgres"), no por "localhost" — se
      # sobrescribe aquí el valor de .env, que asume Postgres expuesto en
      # localhost:5432 (el caso de correr fuera de Docker).
      DATABASE_URL: postgresql+psycopg://crypto:crypto@postgres:5432/crypto_trading
    volumes:
      # Monta el repo completo: los cambios de código se reflejan sin
      # reconstruir la imagen. Solo agregar/cambiar una dependencia en
      # pyproject.toml requiere `docker compose build app`.
      - .:/app
    working_dir: /app
    # No hace nada por sí solo (no es un proceso de fondo real — sección 6
    # del plan): se mantiene vivo para poder correr comandos puntuales con
    # `docker compose run --rm app <comando>`.
    command: ["tail", "-f", "/dev/null"]

  ui:
    # Interfaz Streamlit (Paso 10): lecturas en transacción READ ONLY; las únicas
    # escrituras son las acciones manuales de `app/services/commands.py`. Misma imagen que `app`.
    # SEGURIDAD (secciones 10 y 21 del plan: sin conexiones entrantes desde
    # fuera): el proceso escucha en 0.0.0.0 DENTRO del contenedor, pero el
    # puerto se publica únicamente en 127.0.0.1 del anfitrión — solo se
    # alcanza desde este mismo PC en http://localhost:8501. Nunca cambiar
    # "127.0.0.1:" por un puerto abierto a la red.
    build:
      context: .
      dockerfile: Dockerfile
    image: crypto-trading-platform:dev
    container_name: crypto_trading_ui
    depends_on:
      postgres:
        condition: service_healthy
    # SEGURIDAD (P4 del master prompt, privilegios mínimos): `ui` NO usa
    # `env_file`. Recibe solo las variables que la interfaz necesita; sin
    # claves de Binance ni token de Telegram. Una variable sin valor
    # (`NOMBRE:`) se toma del `.env` del anfitrión y, si ahí no existe, no
    # se define en el contenedor (así los valores opcionales siguen siendo
    # "no definidos", no cadenas vacías). Si la interfaz llega a necesitar
    # otra variable, se agrega aquí A MANO y a propósito.
    environment:
      DATABASE_URL: postgresql+psycopg://crypto:crypto@postgres:5432/crypto_trading
      PAPER_CAPITAL_USD:
      MAX_OPEN_POSITIONS:
      ANTHROPIC_API_KEY:             # la usa el Entrevistador (página Perfil)
      ANTHROPIC_SALDO_DECLARADO_USD: # saldo estimado en la página Sistema
      ANTHROPIC_SALDO_DECLARADO_EN:
    volumes:
      - .:/app
      # El volumen de arriba también expone `.env` DENTRO del contenedor
      # (`Settings` lo lee desde el directorio de trabajo, y cualquier
      # código del proceso podría abrirlo). Se tapa con un archivo sin
      # secretos; el resto del repo (p. ej. el archivo PARAR) sigue visible.
      - ./docker/ui-sin-secretos.env:/app/.env:ro
    working_dir: /app
    ports:
      - "127.0.0.1:8501:8501"
    command: ["streamlit", "run", "app/ui/app.py"]
    restart: unless-stopped

  ui-railway:
    # Misma interfaz, pero conectada a la base de RAILWAY con el rol de SOLO
    # LECTURA `crypto_ui` (Paso 11-0). No arranca con `docker compose up`: solo con
    #   docker compose --profile railway up ui-railway   (http://localhost:8502)
    # Requiere la variable de entorno UI_DATABASE_URL con la URL de `crypto_ui`
    # (ver README; se define en la sesión de PowerShell, nunca en el repositorio).
    # SEGURIDAD (P4): sin claves de Binance, Telegram ni Anthropic (la entrevista
    # del Perfil está deshabilitada en solo lectura), sin `env_file`, `.env`
    # tapado, y puerto publicado solo en 127.0.0.1.
    profiles: ["railway"]
    image: crypto-trading-platform:dev
    container_name: crypto_trading_ui_railway
    environment:
      DATABASE_URL: "${UI_DATABASE_URL:-}"
      PAPER_CAPITAL_USD:
      MAX_OPEN_POSITIONS:
    volumes:
      - .:/app
      - ./docker/ui-sin-secretos.env:/app/.env:ro
    working_dir: /app
    ports:
      - "127.0.0.1:8502:8501"
    command: ["streamlit", "run", "app/ui/app.py"]
    restart: "no"

volumes:
  pgdata:
